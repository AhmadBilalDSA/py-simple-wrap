site_name: py-simple-wrap
site_description: A beginner-friendly Python wrapper package
site_url: https://github.com/sara-czasak/py-simple-wrap/
repo_url: https://github.com/sara-czasak/py-simple-wrap
repo_name: sara-czasak/py-simple-wrap

theme:
  name: material
  palette:
    primary: indigo
  features:
    - content.code.copy

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [py_simple_package/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true

markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Tutorial:
      - Quickstart: tutorial/quickstart.md
      - Easy Flow: tutorial/easy_flow.md
      - Easy Strings: tutorial/easy_strings.md
      - Easy Web: tutorial/easy_web.md
      - Easy Async: tutorial/easy_async.md
      - Easy Colors: tutorial/easy_colors.md
      - Easy Converter: tutorial/easy_converter.md
      - Easy Csv: tutorial/easy_csv.md
      - Easy Data Visualization: tutorial/easy_data_visualization.md
  - How To:
      - Contributing: how-to/contributing.md
  - Reference:
      - Easy Numbers: reference/easy_numbers.md
      - Easy Lists: reference/easy_lists.md
      - Easy Strings: reference/easy_strings.md
      - Easy Text: reference/easy_text.md
      - Easy Colors: reference/easy_colors.md
      - Easy Web: reference/easy_web.md
      - Easy Json: reference/easy_json.md
      - Easy Converter: reference/easy_converter.md
      - Easy Date Formatter: reference/easy_date_formatter.md
      - Easy File Manager: reference/easy_file_manager.md
      - Easy Validator: reference/easy_validator.md
      - Easy Dict: reference/easy_dict.md
      - Easy Stats: reference/easy_stats.md
      - Easy Images: reference/easy_images.md
      - Easy Math: reference/easy_math.md
      - Easy Generator: reference/easy_generator.md
      - Easy CSV: reference/easy_csv.md
      - Easy Game: reference/easy_game.md
      - Easy Regex: reference/easy_regex.md
      - Easy Flow: reference/easy_flow.md
      - Easy Async: reference/easy_async.md
  - About:
      - README: readme.md
      - Contributors: about/contributors.md
      - License: about/license.md
