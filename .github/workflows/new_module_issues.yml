name: Maintain new-module issue pool

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  top-up-new-module-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Top up open "new module" issues to 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(grep '^title:' .github/ISSUE_TEMPLATE/new_module_issue.md | sed 's/^title: *//')
          labels=$(grep '^labels:' .github/ISSUE_TEMPLATE/new_module_issue.md | sed 's/^labels: *//')
          body=$(awk '/^---$/{c++; next} c>=2' .github/ISSUE_TEMPLATE/new_module_issue.md)

          open_count=$(gh issue list --state open --search "in:title \"$title\"" --json title -q '.[].title' | wc -l)
          echo "Currently open: $open_count"

          missing=$((5 - open_count))
          if [ "$missing" -lt 0 ]; then
            missing=0
          fi
          echo "Creating $missing new issue(s)"

          for i in $(seq 1 "$missing"); do
            gh issue create --title "$title" --body "$body" --label "$labels"
          done
