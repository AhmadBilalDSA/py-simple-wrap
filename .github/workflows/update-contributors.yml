name: Flag new contributors

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-new-contributors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect new contributors and stage them
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/update_contributors.py

      - name: Open or update a PR if there are changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- CONTRIBUTORS.md; then
            echo "No changes to CONTRIBUTORS.md"
            exit 0
          fi

          branch="bot/new-contributors"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add CONTRIBUTORS.md
          git commit -m "chore: flag new contributors for CONTRIBUTORS.md review"
          git push -u origin "$branch" --force

          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR already open on $branch — branch updated in place."
          else
            gh pr create \
              --title "chore: new contributors detected for CONTRIBUTORS.md" \
              --body "Automated check found contributor(s) not yet listed in CONTRIBUTORS.md. Sort them into a guild and write their blurb, then merge (or close if this was a false positive)." \
              --base main \
              --head "$branch"
          fi
