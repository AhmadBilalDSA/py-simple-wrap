name: Check for missing tests
on:
  push:
    branches: [main]
    paths:
      - 'py_simple_package/src/py_simple/**'

jobs:
  check-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test] pytest-cov

      - name: Run tests with coverage
        run: |
          pytest --cov=py_simple_package --cov-report=xml


      - name: Get changed files
        id: changed
        run: |
          git diff --name-only ${{ github.event.before }} ${{ github.event.after }} > changed_files.txt
          cat changed_files.txt

      - name: Check for missing tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r file; do
            case "$file" in
              py_simple_package/src/py_simple/*.py)
                base=$(basename "$file" .py)
                [ "$base" = "__init__" ] && continue
                short="${base#easy_}"
                test_file="tests/test_${short}.py"
                needs_issue=false
                if [ ! -f "$test_file" ]; then
                  needs_issue=true
                else
                  line_rate=$(grep -oP "filename=\"${file}\" line-rate=\"\K[0-9.]+" coverage.xml)
                  if [ -n "$line_rate" ] && awk -v r="$line_rate" 'BEGIN{exit !(r < 1)}'; then
                    needs_issue=true
                  fi
                fi
                if [ "$needs_issue" = true ]; then
                  title="🧪 [Help Wanted] Implement unit tests for ${base}"
                  existing=$(gh issue list --state open --search "in:title \"$title\"" --json title -q '.[].title')
                  if [ -z "$existing" ]; then
                    body=$(awk '/^---$/{c++; next} c>=2' .github/ISSUE_TEMPLATE/tests_issue.md | sed "s/{{MODULE_NAME}}/${base}/g")
                    gh issue create --title "$title" --body "$body" --label "testing,good first issue"
                  fi
                fi

                ref_file="docs/reference/${base}.md"
                if [ ! -f "$ref_file" ]; then
                  ref_title_raw=$(grep '^title:' .github/ISSUE_TEMPLATE/docs_referance_issue.md | sed 's/^title: *//')
                  ref_title="${ref_title_raw//\{\{MODULE_NAME\}\}/$base}"
                  ref_labels=$(grep '^labels:' .github/ISSUE_TEMPLATE/docs_referance_issue.md | sed 's/^labels: *//')

                  existing_ref=$(gh issue list --state open --search "in:title \"$ref_title\"" --json title -q '.[].title')
                  if [ -z "$existing_ref" ]; then
                    ref_body=$(awk '/^---$/{c++; next} c>=2' .github/ISSUE_TEMPLATE/docs_referance_issue.md | sed "s/{{MODULE_NAME}}/${base}/g")
                    gh issue create --title "$ref_title" --body "$ref_body" --label "$ref_labels"
                  fi
                fi

                tutorial_file="docs/tutorial/${base}.md"
                if [ ! -f "$tutorial_file" ]; then
                  tut_title_raw=$(grep '^title:' .github/ISSUE_TEMPLATE/tutorial_issue.md | sed 's/^title: *//')
                  tut_title="${tut_title_raw//\{\{MODULE_NAME\}\}/$base}"
                  tut_labels=$(grep '^labels:' .github/ISSUE_TEMPLATE/tutorial_issue.md | sed 's/^labels: *//')

                  existing_tut=$(gh issue list --state open --search "in:title \"$tut_title\"" --json title -q '.[].title')
                  if [ -z "$existing_tut" ]; then
                    tut_body=$(awk '/^---$/{c++; next} c>=2' .github/ISSUE_TEMPLATE/tutorial_issue.md | sed "s/{{MODULE_NAME}}/${base}/g")
                    gh issue create --title "$tut_title" --body "$tut_body" --label "$tut_labels"
                  fi
                fi
                ;;
            esac
          done < changed_files.txt
